<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MalT Cash Flow Live Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* Deep Cyber-Purple Theme Base */
    body { 
      background-color: #0d0b18; 
      color: #f3e8ff; 
      padding: 24px;
      min-height: 100vh;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0d0b18; }
    ::-webkit-scrollbar-thumb { background: #3b0764; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #7e22ce; }

    /* Header & Navigation */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    
    /* Custom Logo Styling */
    .custom-logo {
      height: 56px;
      width: auto;
      max-width: 200px;
      object-fit: contain;
      border-radius: 8px;
    }

    .title { 
      font-size: 26px; 
      font-weight: 800; 
      background: linear-gradient(135deg, #c084fc 0%, #a855f7 50%, #38bdf8 100%); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      letter-spacing: -0.5px;
    }

    /* Animated Cyber Clock Badge */
    .clock-card { 
      background: rgba(24, 20, 42, 0.7); 
      backdrop-filter: blur(12px);
      border: 1px solid rgba(168, 85, 247, 0.3); 
      padding: 10px 18px; 
      border-radius: 14px; 
      display: flex; 
      align-items: center; 
      gap: 14px;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.15);
      animation: purpleGlow 4s infinite alternate ease-in-out;
    }

    /* Green Blinking Circle Indicator */
    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
      animation: pulseGreen 1.5s infinite ease-in-out;
    }
    
    .clock-time { font-size: 17px; font-weight: 700; color: #f3e8ff; font-family: monospace; }
    .clock-label { font-size: 10px; color: #c084fc; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

    /* Glassmorphism Multi-Filter Bar */
    .filter-bar { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 24px; 
      flex-wrap: wrap; 
      background: #18142a; 
      padding: 18px; 
      border-radius: 16px; 
      border: 1px solid #2e2348;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }
    .filter-group label { font-size: 11px; font-weight: 700; color: #a855f7; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-select, .search-input { 
      background: #0d0b18; 
      color: #f3e8ff; 
      border: 1px solid #3b2d59; 
      padding: 10px 14px; 
      border-radius: 10px; 
      font-size: 14px; 
      outline: none; 
      transition: all 0.2s ease;
    }
    .filter-select:focus, .search-input:focus { 
      border-color: #a855f7; 
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
    }

    /* Futuristic KPI Cards Grid */
    .kpi-container { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
      gap: 16px; 
      margin-bottom: 24px; 
    }
    .kpi-card { 
      background: #18142a; 
      padding: 18px; 
      border-radius: 16px; 
      border: 1px solid #2e2348; 
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #a855f7, #c084fc);
    }
    .kpi-card:hover {
      transform: translateY(-4px);
      border-color: #a855f7;
      box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.25);
    }

    /* Accent top borders for individual KPIs */
    .kpi-card.card-gross::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .kpi-card.card-expense::before { background: linear-gradient(90deg, #f43f5e, #fb7185); }
    .kpi-card.card-net::before { background: linear-gradient(90deg, #c084fc, #38bdf8); }
    .kpi-card.card-printing::before { background: linear-gradient(90deg, #818cf8, #a78bfa); }
    .kpi-card.card-laptop::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .kpi-card.card-other::before { background: linear-gradient(90deg, #ec4899, #f472b6); }

    .kpi-label { font-size: 11px; color: #94a3b8; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-size: 22px; font-weight: 800; color: #f3e8ff; }
    
    .text-income { color: #34d399; }
    .text-expense { color: #fb7185; }
    .text-net { color: #c084fc; }

    /* Modern Dark Table */
    .table-container { 
      background: #18142a; 
      border-radius: 16px; 
      border: 1px solid #2e2348; 
      overflow-x: auto; 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
    th { 
      background: #120e22; 
      color: #c084fc; 
      padding: 16px; 
      font-size: 12px; 
      text-transform: uppercase; 
      letter-spacing: 0.8px;
      border-bottom: 1px solid #2e2348;
    }
    td { padding: 14px 16px; border-top: 1px solid #231b39; font-size: 14px; }
    tr:hover td { background: rgba(168, 85, 247, 0.04); }

    /* Neon Badges */
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-income { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-expense { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Button Styling */
    .refresh-btn { 
      background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%); 
      color: #fff; 
      border: none; 
      padding: 10px 20px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 700; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
    }
    .refresh-btn:hover { 
      background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%); 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(168, 85, 247, 0.4);
    }

    /* Keyframe Animations */
    @keyframes pulseGreen {
      0% { transform: scale(0.9); opacity: 0.4; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.9); opacity: 0.4; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes purpleGlow {
      0% { border-color: rgba(168, 85, 247, 0.2); box-shadow: 0 0 10px rgba(168, 85, 247, 0.1); }
      100% { border-color: rgba(168, 85, 247, 0.6); box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
    }

    /* --- MOBILE RESPONSIVE MEDIA QUERIES --- */
    @media (max-width: 768px) {
      body { padding: 14px; }
      .header { flex-direction: column; align-items: flex-start; gap: 14px; }
      .header-left { width: 100%; }
      .title { font-size: 20px; }
      .custom-logo { height: 44px; }
      .clock-card { width: 100%; justify-content: space-between; }
      
      .filter-bar { padding: 14px; gap: 10px; }
      .filter-group { min-width: 47%; }
      
      .kpi-container { 
        grid-template-columns: repeat(2, 1fr); 
        gap: 12px; 
      }
      .kpi-card { padding: 14px; }
      .kpi-value { font-size: 18px; }
      
      td, th { padding: 10px 12px; font-size: 13px; }
    }

    @media (max-width: 480px) {
      .filter-group { min-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="https://i.postimg.cc/Vsjz1ksp/logo.png" alt="MalT Logo" class="custom-logo" onerror="this.style.display='none'">
      <h1 class="title">MalT Cash Flow Live Dashboard</h1>
    </div>

    <!-- Cyber Clock & Live Status -->
    <div class="clock-card">
      <span class="live-dot" title="Live Sync Active"></span>
      <div>
        <div class="clock-label">Malaysia Time (MYT)</div>
        <div class="clock-time" id="digital-clock">00:00:00 AM</div>
      </div>
      <button class="refresh-btn" onclick="fetchData()">Refresh</button>
    </div>
  </div>

  <!-- Multi-Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <label for="timeframe-filter">Time Period</label>
      <select id="timeframe-filter" class="filter-select" onchange="renderDashboard()">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="weekly">This Week</option>
        <option value="monthly">This Month</option>
        <option value="yearly">This Year</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="type-filter">Type</label>
      <select id="type-filter" class="filter-select" onchange="renderDashboard()">
        <option value="all">Income & Expense</option>
        <option value="income">Income Only</option>
        <option value="expense">Expense Only</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="business-filter">Business</label>
      <select id="business-filter" class="filter-select" onchange="renderDashboard()">
        <option value="all">All Businesses</option>
        <option value="printing">Printing Service</option>
        <option value="laptop">Laptop Service</option>
        <option value="other">Other Business</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="month-filter">Filter Month</label>
      <select id="month-filter" class="filter-select" onchange="renderDashboard()">
        <option value="all">All Months</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="search-input">Search Description</label>
      <input type="text" id="search-input" class="search-input" placeholder="Search item, method..." oninput="renderDashboard()">
    </div>
  </div>

  <!-- Dynamic Financial KPI Cards -->
  <div class="kpi-container">
    <div class="kpi-card card-gross">
      <div class="kpi-label">Gross Income</div>
      <div class="kpi-value text-income" id="kpi-gross">RM 0.00</div>
    </div>
    <div class="kpi-card card-expense">
      <div class="kpi-label">Total Expenses</div>
      <div class="kpi-value text-expense" id="kpi-expenses">RM 0.00</div>
    </div>
    <div class="kpi-card card-net">
      <div class="kpi-label">Nett Total (RM)</div>
      <div class="kpi-value text-net" id="kpi-net">RM 0.00</div>
    </div>
    <div class="kpi-card card-printing">
      <div class="kpi-label">Printing Service</div>
      <div class="kpi-value" id="kpi-printing">RM 0.00</div>
    </div>
    <div class="kpi-card card-laptop">
      <div class="kpi-label">Laptop Service</div>
      <div class="kpi-value" id="kpi-laptop">RM 0.00</div>
    </div>

    <!-- NEW: Other Service KPI Card -->
    <div class="kpi-card card-other">
      <div class="kpi-label">Other Business</div>
      <div class="kpi-value" id="kpi-other">RM 0.00</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-label">Transactions</div>
      <div class="kpi-value" id="kpi-count">0</div>
    </div>
  </div>

  <!-- Transaction Data Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Business</th>
          <th>Payment</th>
          <th>Description</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6" style="text-align:center; color:#c084fc;">Loading live cash flow data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoUWhWM08VMm_fV1FH9hw_G5RlTjxDUaorTDpSZOefmH_eoHj70n7BsW8AcB72Kcp7Gw/exec";

    let rawData = [];

    // Real-Time Digital Clock (MYT)
    function updateMalaysiaClock() {
      const now = new Date();
      const timeOptions = { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      const dateOptions = { timeZone: 'Asia/Kuala_Lumpur', day: '2-digit', month: 'short', year: 'numeric' };
      
      const timeString = now.toLocaleTimeString('en-US', timeOptions);
      const dateString = now.toLocaleDateString('en-US', dateOptions);

      document.getElementById('digital-clock').innerText = `${timeString} (${dateString})`;
    }
    
    setInterval(updateMalaysiaClock, 1000);
    updateMalaysiaClock();

    // Enhanced Safe Date Parser
    function parseDate(dateStr) {
      if (!dateStr) return null;
      let cleanStr = String(dateStr).replace(' at ', ' ');
      const d = new Date(cleanStr);
      if (!isNaN(d.getTime())) return d;
      const fallback = new Date(dateStr);
      return !isNaN(fallback.getTime()) ? fallback : null;
    }

    // Extract Month-Year (e.g., "Nov 2026")
    function getMonthKey(dateStr) {
      const d = parseDate(dateStr);
      if (d) {
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      }
      const match = String(dateStr).match(/([A-Za-z]{3})\s+(\d{4})/);
      if (match) return `${match[1]} ${match[2]}`;
      return "Other";
    }

    // Fetch live JSON data from Apps Script
    async function fetchData() {
      const tbody = document.getElementById("table-body");
      try {
        const response = await fetch(SCRIPT_URL);
        rawData = await response.json();
        
        populateMonthDropdown();
        renderDashboard();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#fb7185;">Error loading data. Verify your Apps Script URL.</td></tr>`;
      }
    }

    // Dynamically build month filter options
    function populateMonthDropdown() {
      const monthSelect = document.getElementById("month-filter");
      const currentSelected = monthSelect.value;
      
      const monthsSet = new Set();
      rawData.forEach(row => {
        const monthKey = getMonthKey(row.date);
        if (monthKey !== "Other") monthsSet.add(monthKey);
      });

      monthSelect.innerHTML = `<option value="all">All Months</option>`;
      monthsSet.forEach(month => {
        const option = document.createElement("option");
        option.value = month;
        option.textContent = month;
        monthSelect.appendChild(option);
      });

      if (Array.from(monthSelect.options).some(opt => opt.value === currentSelected)) {
        monthSelect.value = currentSelected;
      }
    }

    // Check timeframe filters (Today, Week, Month, Year)
    function matchesTimeframe(dateStr, timeframe) {
      if (timeframe === "all") return true;
      const date = parseDate(dateStr);
      if (!date) return true;

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      if (timeframe === "today") {
        return date >= today;
      } else if (timeframe === "weekly") {
        const startOfWeek = new Date(today);
        startOfWeek.setDate(today.getDate() - today.getDay());
        return date >= startOfWeek;
      } else if (timeframe === "monthly") {
        return date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
      } else if (timeframe === "yearly") {
        return date.getFullYear() === now.getFullYear();
      }
      return true;
    }

    // Main render, sort & math logic engine
    function renderDashboard() {
      const timeframeFilter = document.getElementById("timeframe-filter").value;
      const typeFilter = document.getElementById("type-filter").value.toLowerCase();
      const businessFilter = document.getElementById("business-filter").value.toLowerCase();
      const monthFilter = document.getElementById("month-filter").value;
      const searchQuery = document.getElementById("search-input").value.toLowerCase();
      const tbody = document.getElementById("table-body");

      tbody.innerHTML = "";

      let grossIncome = 0;
      let totalExpenses = 0;
      let printingNet = 0;
      let laptopNet = 0;
      let otherNet = 0;
      let count = 0;

      // 1. Filter rows
      const filtered = rawData.filter(row => {
        const type = (row.type || "Income").toLowerCase();
        const matchesType = typeFilter === "all" || type === typeFilter;
        
        const rowBiz = (row.business || "").toLowerCase();
        let matchesBusiness = false;
        if (businessFilter === "all") {
          matchesBusiness = true;
        } else if (businessFilter === "other") {
          matchesBusiness = rowBiz.includes("other") || (!rowBiz.includes("printing") && !rowBiz.includes("laptop"));
        } else {
          matchesBusiness = rowBiz.includes(businessFilter);
        }

        const matchesMonth = monthFilter === "all" || getMonthKey(row.date) === monthFilter;
        const matchesTime = matchesTimeframe(row.date, timeframeFilter);
        const matchesSearch = !searchQuery || 
          (row.description && row.description.toLowerCase().includes(searchQuery)) ||
          (row.business && row.business.toLowerCase().includes(searchQuery)) ||
          (row.paymentMethod && row.paymentMethod.toLowerCase().includes(searchQuery));

        return matchesType && matchesBusiness && matchesMonth && matchesTime && matchesSearch;
      });

      // 2. Strict Date Sorting (Newest date on top)
      filtered.sort((a, b) => {
        const dateA = parseDate(a.date) || new Date(0);
        const dateB = parseDate(b.date) || new Date(0);
        return dateB.getTime() - dateA.getTime();
      });

      // 3. Render rows into table and compute totals
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#c084fc;">No matching transactions found.</td></tr>`;
      } else {
        filtered.forEach(row => {
          const amt = Number(row.amount) || 0;
          const isExpense = row.type && row.type.toLowerCase() === "expense";
          count++;

          if (isExpense) {
            totalExpenses += amt;
          } else {
            grossIncome += amt;
          }

          const rowBiz = (row.business || "").toLowerCase();
          if (rowBiz.includes("printing")) {
            printingNet += isExpense ? -amt : amt;
          } else if (rowBiz.includes("laptop")) {
            laptopNet += isExpense ? -amt : amt;
          } else {
            otherNet += isExpense ? -amt : amt;
          }

          const badgeClass = isExpense ? "badge-expense" : "badge-income";

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.date || ""}</td>
            <td><span class="badge ${badgeClass}">${isExpense ? "Expense" : "Income"}</span></td>
            <td>${row.business || ""}</td>
            <td>${row.paymentMethod || ""}</td>
            <td>${row.description || ""}</td>
            <td><strong>${isExpense ? "-" : ""}RM ${amt.toFixed(2)}</strong></td>
          `;
          tbody.appendChild(tr);
        });
      }

      const netTotal = grossIncome - totalExpenses;

      // Update Dashboard KPIs
      document.getElementById("kpi-gross").innerText = `RM ${grossIncome.toFixed(2)}`;
      document.getElementById("kpi-expenses").innerText = `RM ${totalExpenses.toFixed(2)}`;
      
      const netKpiElem = document.getElementById("kpi-net");
      netKpiElem.innerText = `RM ${netTotal.toFixed(2)}`;
      netKpiElem.style.color = netTotal < 0 ? "#fb7185" : "#c084fc";

      document.getElementById("kpi-printing").innerText = `RM ${printingNet.toFixed(2)}`;
      document.getElementById("kpi-laptop").innerText = `RM ${laptopNet.toFixed(2)}`;
      document.getElementById("kpi-other").innerText = `RM ${otherNet.toFixed(2)}`;
      document.getElementById("kpi-count").innerText = count;
    }

    // Initial load & 10s auto-refresh
    fetchData();
    setInterval(fetchData, 10000);
  </script>
</body>
</html>
