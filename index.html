<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MalT Cash Flow Live Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 24px; }
    
    /* Header Styling */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .title { font-size: 24px; font-weight: 700; color: #38bdf8; }

    /* Digital Clock & Animated Live Badge */
    .clock-card { 
      background: #1e293b; 
      border: 1px solid #334155; 
      padding: 10px 18px; 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      gap: 14px;
      animation: borderGlow 4s infinite alternate ease-in-out;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
      animation: pulseDot 1.5s infinite ease-in-out;
    }
    .clock-time { font-size: 18px; font-weight: 700; color: #f8fafc; font-family: monospace; }
    .clock-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }

    /* Filters */
    .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
    .filter-group label { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
    .filter-select, .search-input { background: #0f172a; color: #f8fafc; border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
    .filter-select:focus, .search-input:focus { border-color: #38bdf8; }

    /* KPI Cards with Looping Pulse Animation */
    .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { 
      background: #1e293b; 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid #334155; 
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }
    .kpi-label { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
    .kpi-value { font-size: 24px; font-weight: 700; color: #f8fafc; }

    /* Table Styling */
    .table-container { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #0f172a; color: #94a3b8; padding: 14px; font-size: 13px; text-transform: uppercase; }
    td { padding: 14px; border-top: 1px solid #334155; font-size: 14px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-income { background: #064e3b; color: #6ee7b7; }
    .badge-expense { background: #7f1d1d; color: #fca5a5; }

    .refresh-btn { 
      background: #0284c7; 
      color: #fff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      transition: background 0.2s ease;
    }
    .refresh-btn:hover { background: #0369a1; }

    /* --- Keyframe Looping Animations --- */
    @keyframes pulseDot {
      0% { transform: scale(0.9); opacity: 0.4; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.9); opacity: 0.4; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes borderGlow {
      0% { border-color: rgba(56, 189, 248, 0.2); box-shadow: 0 0 8px rgba(56, 189, 248, 0.05); }
      100% { border-color: rgba(56, 189, 248, 0.6); box-shadow: 0 0 16px rgba(56, 189, 248, 0.2); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1 class="title">MalT Cash Flow Live Dashboard</h1>
    </div>

    <!-- Digital Clock & Animated Live Status -->
    <div class="clock-card">
      <span class="live-dot" title="Live Sync Active"></span>
      <div>
        <div class="clock-label">Malaysia Time (MYT)</div>
        <div class="clock-time" id="digital-clock">00:00:00 AM</div>
      </div>
      <button class="refresh-btn" onclick="fetchData()">Refresh</button>
    </div>
  </div>

  <!-- Filter Bar for Business, Month, and Search -->
  <div class="filter-bar">
    <div class="filter-group">
      <label for="business-filter">Filter Business</label>
      <select id="business-filter" class="filter-select" onchange="renderDashboard()">
        <option value="all">All Businesses</option>
        <option value="printing">Printing Service</option>
        <option value="laptop">Laptop Service</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="month-filter">Filter Month</label>
      <select id="month-filter" class="filter-select" onchange="renderDashboard()">
        <option value="all">All Months</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="search-input">Search Description</label>
      <input type="text" id="search-input" class="search-input" placeholder="Type to search..." oninput="renderDashboard()">
    </div>
  </div>

  <!-- Dynamic KPI Cards -->
  <div class="kpi-container">
    <div class="kpi-card">
      <div class="kpi-label">Filtered Revenue</div>
      <div class="kpi-value" id="kpi-total">RM 0.00</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Printing Service</div>
      <div class="kpi-value" id="kpi-printing">RM 0.00</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Laptop Service</div>
      <div class="kpi-value" id="kpi-laptop">RM 0.00</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Transactions</div>
      <div class="kpi-value" id="kpi-count">0</div>
    </div>
  </div>

  <!-- Transaction Data Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Business</th>
          <th>Payment</th>
          <th>Description</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6" style="text-align:center;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Replace with your Google Apps Script Web App URL:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoUWhWM08VMm_fV1FH9hw_G5RlTjxDUaorTDpSZOefmH_eoHj70n7BsW8AcB72Kcp7Gw/exec";

    let rawData = [];

    // Real-Time Digital Clock locked to Asia/Kuala_Lumpur (Malaysia Time)
    function updateMalaysiaClock() {
      const now = new Date();
      const timeOptions = {
        timeZone: 'Asia/Kuala_Lumpur',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };
      const dateOptions = {
        timeZone: 'Asia/Kuala_Lumpur',
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      };
      
      const timeString = now.toLocaleTimeString('en-US', timeOptions);
      const dateString = now.toLocaleDateString('en-US', dateOptions);

      document.getElementById('digital-clock').innerText = `${timeString} (${dateString})`;
    }
    
    setInterval(updateMalaysiaClock, 1000);
    updateMalaysiaClock();

    // Extract Month-Year (e.g., "Nov 2026") from date strings
    function getMonthKey(dateStr) {
      if (!dateStr) return "Unknown";
      const d = new Date(dateStr);
      if (!isNaN(d.getTime())) {
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      }
      const match = dateStr.match(/([A-Za-z]{3})\s+(\d{4})/);
      if (match) return `${match[1]} ${match[2]}`;
      return "Other";
    }

    // Fetch live JSON data from Apps Script
    async function fetchData() {
      const tbody = document.getElementById("table-body");
      try {
        const response = await fetch(SCRIPT_URL);
        rawData = await response.json();
        
        populateMonthDropdown();
        renderDashboard();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#f87171;">Error loading data. Verify your Apps Script URL.</td></tr>`;
      }
    }

    // Dynamically build month filter options
    function populateMonthDropdown() {
      const monthSelect = document.getElementById("month-filter");
      const currentSelected = monthSelect.value;
      
      const monthsSet = new Set();
      rawData.forEach(row => {
        const monthKey = getMonthKey(row.date);
        if (monthKey !== "Unknown") monthsSet.add(monthKey);
      });

      monthSelect.innerHTML = `<option value="all">All Months</option>`;
      monthsSet.forEach(month => {
        const option = document.createElement("option");
        option.value = month;
        option.textContent = month;
        monthSelect.appendChild(option);
      });

      if (Array.from(monthSelect.options).some(opt => opt.value === currentSelected)) {
        monthSelect.value = currentSelected;
      }
    }

    // Filter data and update table + KPI cards
    function renderDashboard() {
      const businessFilter = document.getElementById("business-filter").value.toLowerCase();
      const monthFilter = document.getElementById("month-filter").value;
      const searchQuery = document.getElementById("search-input").value.toLowerCase();
      const tbody = document.getElementById("table-body");

      tbody.innerHTML = "";

      let total = 0, printing = 0, laptop = 0, count = 0;

      const filtered = rawData.filter(row => {
        const matchesBusiness = businessFilter === "all" || (row.business && row.business.toLowerCase().includes(businessFilter));
        const matchesMonth = monthFilter === "all" || getMonthKey(row.date) === monthFilter;
        const matchesSearch = !searchQuery || 
          (row.description && row.description.toLowerCase().includes(searchQuery)) ||
          (row.business && row.business.toLowerCase().includes(searchQuery)) ||
          (row.paymentMethod && row.paymentMethod.toLowerCase().includes(searchQuery));

        return matchesBusiness && matchesMonth && matchesSearch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No matching transactions found.</td></tr>`;
      } else {
        filtered.forEach(row => {
          const amt = Number(row.amount) || 0;
          total += amt;
          count++;

          if (row.business && row.business.toLowerCase().includes("printing")) printing += amt;
          if (row.business && row.business.toLowerCase().includes("laptop")) laptop += amt;

          const badgeClass = row.type && row.type.toLowerCase() === "expense" ? "badge-expense" : "badge-income";

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.date || ""}</td>
            <td><span class="badge ${badgeClass}">${row.type || "Income"}</span></td>
            <td>${row.business || ""}</td>
            <td>${row.paymentMethod || ""}</td>
            <td>${row.description || ""}</td>
            <td><strong>RM ${amt.toFixed(2)}</strong></td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("kpi-total").innerText = `RM ${total.toFixed(2)}`;
      document.getElementById("kpi-printing").innerText = `RM ${printing.toFixed(2)}`;
      document.getElementById("kpi-laptop").innerText = `RM ${laptop.toFixed(2)}`;
      document.getElementById("kpi-count").innerText = count;
    }

    // Initial load and auto-refresh every 10 seconds
    fetchData();
    setInterval(fetchData, 10000);
  </script>
</body>
</html>
