<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MalT Cash Flow Live Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .title { font-size: 24px; font-weight: 700; color: #38bdf8; }

    .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
    .filter-group label { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
    .filter-select, .search-input { background: #0f172a; color: #f8fafc; border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
    .filter-select:focus, .search-input:focus { border-color: #38bdf8; }

    .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .kpi-label { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
    .kpi-value { font-size: 24px; font-weight: 700; color: #f8fafc; }

    .table-container { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #0f172a; color: #94a3b8; padding: 14px; font-size: 13px; text-transform: uppercase; }
    td { padding: 14px; border-top: 1px solid #334155; font-size: 14px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-income { background: #064e3b; color: #6ee7b7; }
    .badge-expense { background: #7f1d1d; color: #fca5a5; }
    .refresh-btn { background: #0284c7; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .refresh-btn:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">MalT Cash Flow Live Dashboard</h1>
    <button class="refresh-btn" onclick="fetchData()">Refresh Data</button>
  </div>

  <!-- Filter Bar for Business, Month, and Search -->
